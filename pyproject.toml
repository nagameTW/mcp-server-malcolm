[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "mcp-server-malcolm"
version = "0.6.0"
description = "MCP server for the Malcolm network traffic analysis platform (Zeek + Suricata + Arkime + OpenSearch + NetBox) — full read surface plus opt-in, audited write tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nagameTW" }]
keywords = ["mcp", "malcolm", "zeek", "suricata", "arkime", "threat-hunting", "network-security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    # mcp 2.0 dropped mcp.server.fastmcp (FastMCP is now MCPServer in
    # mcp.server.mcpserver), which every tool module here imports. Pin to 1.x
    # until the server is ported.
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/nagameTW/mcp-server-malcolm"
Repository = "https://github.com/nagameTW/mcp-server-malcolm"

[project.scripts]
mcp-server-malcolm = "mcp_server_malcolm:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "BLE"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
